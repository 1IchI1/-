function buildTable(){
  const tbody=document.getElementById('tbody');
  DATA.forEach(([no,cat,asis,gap,impact,tobe,str])=>{
    const tr=document.createElement('tr');
    tr.dataset.cat=cat;
    tr.dataset.str=str;
    tr.dataset.kw=(no+cat+asis+gap+tobe).toLowerCase();
    const cc=CAT_CLASS[cat]||'cat-c11';
    tr.innerHTML=`
      <td class="no">${no}</td>
      <td><span class="cat-badge ${cc}">${cat}</span></td>
      <td class="asis"><div class="asis-label">現状</div>${asis}</td>
      <td style="padding:0">
        <div class="gap-cell">
          <div class="gap-text">${gap}</div>
          <div class="gap-impact">📌 ${impact}</div>
        </div>
      </td>
      <td class="tobe"><div class="tobe-label">解決後</div>${tobe}</td>
      <td class="str ${STR_CSS[str]}">${STR_LABEL[str]}</td>
    `;
    tbody.appendChild(tr);
  });
  updateCount();
}

function applyFilter(){
  const cat=document.getElementById('catFilter').value;
  const str=document.getElementById('strFilter').value;
  const kw=document.getElementById('kwFilter').value.toLowerCase();
  let vis=0;
  document.querySelectorAll('#tbody tr').forEach(tr=>{
    const show=
      (!cat||tr.dataset.cat===cat)&&
      (!str||tr.dataset.str===str)&&
      (!kw||tr.dataset.kw.includes(kw));
    tr.classList.toggle('hidden',!show);
    if(show)vis++;
  });
  document.getElementById('rowCount').textContent=vis;
}

function updateCount(){
  document.getElementById('rowCount').textContent=DATA.length;
}

buildTable();
</script>
